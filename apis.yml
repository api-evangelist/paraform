aid: paraform
name: Paraform
description: >-
  Paraform is an agentic hiring marketplace where expert recruiters and custom AI
  agents work together to fill companies' most important roles. Companies post open
  roles and work with multiple vetted recruiters from a network of 10,000+ professionals
  in one place, while Paraform's AI toolkit handles sourcing, candidate matching, CRM,
  notetaking, and scheduling. The platform charges a listing (subscription) fee to
  publish roles and a success fee when a hire is made. Paraform does not publish a
  public developer API; instead it integrates into customers' existing ATS and
  productivity tools (Ashby, Greenhouse, Slack, Gmail, Calendly, Google Calendar) by
  consuming those partners' APIs and webhooks to keep candidate, role, and interview
  status in sync bidirectionally.
